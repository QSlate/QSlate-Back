name: qslate-back

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: gateway/cmd/gateway
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      AUTH_SERVICE_URL: http://auth:8080
      WORKSPACE_SERVICE_URL: http://workspace:8080
      WIDGETS_SERVICE_URL: http://widgets:8080
      ROUTES_FILE: /app/routes.json
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      workspace:
        condition: service_healthy
    networks: [edge, auth-api, workspace-api, widgets-api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  auth:
    env_file:
      - path: .env.oauth
        required: false
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: services/auth/cmd/auth
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${AUTH_DATABASE_PASSWORD:?Run make init}@auth-db:5432/qslate_auth?sslmode=disable
      JWT_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      ACCESS_TOKEN_TTL: 15m
      BCRYPT_COST: 12
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_ADDR: mailpit:1025
      SMTP_TLS_MODE: plain
      SMTP_FROM: noreply@qslate.local
      OAUTH_PROVIDERS_FILE: /app/providers.json
    volumes:
      - ./.secrets/auth-private.pem:/run/secrets/auth-private.pem:ro,Z
      - ./services/auth/config/providers.json:/app/providers.json:ro,Z
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [auth-api, auth-storage, auth-mail, auth-egress, workspace-auth, widgets-auth]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: services/workspace/cmd/service
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${WORKSPACE_DATABASE_PASSWORD:?Run make init}@workspace-db:5432/qslate_workspace?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      WORKSPACE_LAYOUT_FILE: /app/layout.json
      WIDGETS_SERVICE_URL: http://widgets:8080
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/workspace/config/layout.json:/app/layout.json:ro,Z
    depends_on:
      workspace-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      widgets:
        condition: service_healthy
    networks: [workspace-api, workspace-storage, workspace-auth, workspace-widgets]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  widgets:
    env_file:
      - path: .env.preview
        required: false
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: services/widgets/cmd/service
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${WIDGETS_DATABASE_PASSWORD:?Run make init}@widgets-db:5432/qslate_widgets?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      WIDGETS_CONFIG_FILE: /app/catalogue.json
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/widgets/config/catalogue.json:/app/catalogue.json:ro,Z
    depends_on:
      widgets-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [widgets-api, widgets-storage, widgets-auth, workspace-widgets, widgets-preview]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  widgets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${WIDGETS_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_widgets
    volumes:
      - widgets-data:/var/lib/postgresql/data
    networks: [widgets-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_widgets]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${WORKSPACE_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_workspace
    volumes:
      - workspace-data:/var/lib/postgresql/data
    networks: [workspace-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_workspace]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Development inbox only. Production uses an authenticated TLS SMTP transport.
  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [edge, auth-mail]
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks: [auth-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_auth]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  edge:
  auth-api:
    internal: true
  auth-storage:
    internal: true
  auth-mail:
    internal: true
  auth-egress:
  workspace-api:
    internal: true
  workspace-auth:
    internal: true
  workspace-storage:
    internal: true
  widgets-api:
    internal: true
  widgets-storage:
    internal: true
  widgets-auth:
    internal: true
  workspace-widgets:
    internal: true
  widgets-preview:

volumes:
  auth-data:
  workspace-data:
  widgets-data:
