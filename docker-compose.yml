name: qslate-back

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: gateway/cmd/gateway
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      AUTH_SERVICE_URL: http://auth:8080
      ROUTES_FILE: /app/routes.json
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
    networks: [edge, auth-api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_PATH: services/auth/cmd/auth
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${AUTH_DATABASE_PASSWORD:?Run make init}@auth-db:5432/qslate_auth?sslmode=disable
      JWT_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      ACCESS_TOKEN_TTL: 15m
      BCRYPT_COST: 12
    volumes:
      - ./.secrets/auth-private.pem:/run/secrets/auth-private.pem:ro,Z
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [auth-api, auth-storage]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks: [auth-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_auth]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  edge:
  auth-api:
    internal: true
  auth-storage:
    internal: true

volumes:
  auth-data:
