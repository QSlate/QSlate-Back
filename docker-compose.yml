name: qslate-back

services:
  gateway:
    build:
      context: ./gateway
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      AUTH_SERVICE_URL: http://auth:8080
      WORKSPACE_SERVICE_URL: http://workspace:8080
      WIDGETS_SERVICE_URL: http://widgets:8080
      STRATEGY_SERVICE_URL: http://strategy:8080
      MARKETPLACE_SERVICE_URL: http://marketplace:8080
      ROUTES_FILE: /app/routes.json
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      workspace:
        condition: service_healthy
      strategy:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    networks: [edge, auth-api, workspace-api, widgets-api, strategy-api, marketplace-api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  auth:
    env_file:
      - path: .env.oauth
        required: false
    build:
      context: ./services/auth
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${AUTH_DATABASE_PASSWORD:?Run make init}@auth-db:5432/qslate_auth?sslmode=disable
      JWT_PRIVATE_KEY_FILE: /run/secrets/auth-private.pem
      ACCESS_TOKEN_TTL: 15m
      BCRYPT_COST: 12
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_ADDR: mailpit:1025
      SMTP_TLS_MODE: plain
      SMTP_FROM: noreply@qslate.local
      OAUTH_PROVIDERS_FILE: /app/providers.json
    volumes:
      - ./.secrets/auth-private.pem:/run/secrets/auth-private.pem:ro,Z
      - ./services/auth/config/providers.json:/app/providers.json:ro,Z
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [auth-api, auth-storage, auth-mail, auth-egress, workspace-auth, widgets-auth, strategy-auth, marketplace-auth]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace:
    build:
      context: ./services/workspace
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${WORKSPACE_DATABASE_PASSWORD:?Run make init}@workspace-db:5432/qslate_workspace?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      WORKSPACE_LAYOUT_FILE: /app/layout.json
      WIDGETS_SERVICE_URL: http://widgets:8080
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/workspace/config/layout.json:/app/layout.json:ro,Z
    depends_on:
      workspace-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      widgets:
        condition: service_healthy
    networks: [workspace-api, workspace-storage, workspace-auth, workspace-widgets]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  strategy:
    build:
      context: ./services/strategy
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${STRATEGY_DATABASE_PASSWORD:?Run make init}@strategy-db:5432/qslate_strategy?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      STRATEGY_CONFIG_FILE: /app/strategy.json
      STRATEGY_ANALYZER_URL: http://strategy-analyzer:8080
      MARKETPLACE_SERVICE_URL: http://marketplace:8080
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/strategy/config/strategy.json:/app/strategy.json:ro,Z
    depends_on:
      strategy-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      strategy-analyzer:
        condition: service_healthy
    networks: [strategy-api, strategy-auth, strategy-storage, strategy-analysis, marketplace-strategy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  strategy-analyzer:
    build:
      context: ./services/strategy/analyzer
    volumes:
      - ./services/strategy/analyzer/config.json:/app/config.json:ro,Z
    networks: [strategy-analysis]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 32
    ulimits:
      nofile: 64
      core: 0
    healthcheck:
      test: [CMD, python, -I, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  strategy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${STRATEGY_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_strategy
    volumes:
      - strategy-data:/var/lib/postgresql/data
    networks: [strategy-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_strategy]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  widgets:
    env_file:
      - path: .env.preview
        required: false
    build:
      context: ./services/widgets
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${WIDGETS_DATABASE_PASSWORD:?Run make init}@widgets-db:5432/qslate_widgets?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      WIDGETS_CONFIG_FILE: /app/catalogue.json
      MARKETPLACE_SERVICE_URL: http://marketplace:8080
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/widgets/config/catalogue.json:/app/catalogue.json:ro,Z
    depends_on:
      widgets-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [widgets-api, widgets-storage, widgets-auth, workspace-widgets, widgets-preview, marketplace-widgets]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  marketplace:
    build:
      context: ./services/marketplace
    user: "${QSLATE_UID:?Run make init}:${QSLATE_GID:?Run make init}"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://qslate:${MARKETPLACE_DATABASE_PASSWORD:?Run make init}@marketplace-db:5432/qslate_marketplace?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8080
      WIDGETS_SERVICE_URL: http://widgets:8080
      STRATEGY_SERVICE_URL: http://strategy:8080
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth-public.pem
      MARKETPLACE_CONFIG_FILE: /app/marketplace.json
    volumes:
      - ./.secrets/auth-public.pem:/run/secrets/auth-public.pem:ro,Z
      - ./services/marketplace/config/marketplace.json:/app/marketplace.json:ro,Z
    depends_on:
      marketplace-db:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks: [marketplace-api, marketplace-auth, marketplace-storage, marketplace-widgets, marketplace-strategy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  marketplace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${MARKETPLACE_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_marketplace
    volumes:
      - marketplace-data:/var/lib/postgresql/data
    networks: [marketplace-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_marketplace]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  widgets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${WIDGETS_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_widgets
    volumes:
      - widgets-data:/var/lib/postgresql/data
    networks: [widgets-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_widgets]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  workspace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${WORKSPACE_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_workspace
    volumes:
      - workspace-data:/var/lib/postgresql/data
    networks: [workspace-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_workspace]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Development inbox only. Production uses an authenticated TLS SMTP transport.
  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [edge, auth-mail]
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qslate
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Run make init}
      POSTGRES_DB: qslate_auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks: [auth-storage]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qslate -d qslate_auth]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  edge:
  auth-api:
    internal: true
  auth-storage:
    internal: true
  auth-mail:
    internal: true
  auth-egress:
  workspace-api:
    internal: true
  workspace-auth:
    internal: true
  workspace-storage:
    internal: true
  widgets-api:
    internal: true
  widgets-storage:
    internal: true
  widgets-auth:
    internal: true
  workspace-widgets:
    internal: true
  widgets-preview:
  strategy-api:
    internal: true
  strategy-auth:
    internal: true
  strategy-storage:
    internal: true
  strategy-analysis:
    internal: true
  marketplace-api:
    internal: true
  marketplace-auth:
    internal: true
  marketplace-storage:
    internal: true
  marketplace-widgets:
    internal: true
  marketplace-strategy:
    internal: true

volumes:
  auth-data:
  workspace-data:
  widgets-data:
  strategy-data:
  marketplace-data:
