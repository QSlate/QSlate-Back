name: Go checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qslate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qslate_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qslate -d qslate_auth_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal gateway services templates)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration -count=1 ./services/auth/internal/repository
        env:
          TEST_DATABASE_URL: postgres://qslate:ci-only-password@localhost:5432/qslate_auth_test?sslmode=disable
      - run: make build
      - run: make up
      - run: make test-e2e
        env:
          API_BASE_URL: http://localhost:8080
      - run: docker compose down -v
        if: always()
