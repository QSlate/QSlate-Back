name: Build & Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: qslate

jobs:
  build-simulator:
    name: Build simulator job runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push simulator image
        uses: docker/build-push-action@v5
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/simulator:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/simulator:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/runner:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
